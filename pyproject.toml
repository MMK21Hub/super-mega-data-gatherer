[project]
name = "super-mega-data-gatherer"
version = "0.1.0"
description = "Gathers support data for the Super Mega Dashboard"
readme = "README.md"
authors = [{ name = "Mish", email = "mish@hackclub.com" }]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.3",
    "fastapi[standard]>=0.129.0",
    "jinja2>=3.1",
    "psycopg[binary,pool]>=3.3.2",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0",
    "structlog>=25.5.0",
]

[tool.ruff.lint]
ignore = ["C408"]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
